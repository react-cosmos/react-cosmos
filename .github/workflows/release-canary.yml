name: release-canary
on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: .npm-cache
          key: '${{ runner.os }}-npm'

      - run: npm ci --cache .npm-cache
      - run: npm run release:check

      # https://github.com/lerna/lerna/issues/2622
      # https://github.com/lerna/lerna/issues/3554
      # https://github.com/lerna/lerna/issues/2060#issuecomment-658182391
      - run: |
          npx lerna publish \
            --canary \
            --preid canary.$(git rev-parse --short HEAD) \
            --dist-tag=canary \
            --exact \
            --no-push \
            --no-git-tag-version \
            --yes
